[package]
name = "doclib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Tag-indexed CLI catalog for books and articles, with rclone-backed storage"
authors = ["Jossué Arteche Muñoz"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/CfM47/doc_catalog"
keywords = ["cli", "books", "library", "catalog", "ebook"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
epub = "2.1.5"
inquire = "0.9.4"
lopdf = "0.44.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "http2", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
